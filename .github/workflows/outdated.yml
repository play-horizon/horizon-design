name: Outdated dependencies

# Every day, fails when a direct dependency (or the pnpm version of packageManager) has a newer
# version than the one locked, and lists them in the job summary (scripts/dependencies/outdated.ts,
# where Node follows .node-version: the runtime isn't checked, and @types/node is held to its
# newest release of that major). Dependencies are installed without running their scripts.
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  outdated:
    name: Newer versions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # pnpm outdated exits with 1 whenever something is outdated: only an exit without any JSON is
      # its own failure (the registry unreachable…). The summary fails on anything outdated, and on
      # output it can't read.
      - name: List the outdated dependencies
        run: |
          status=0
          pnpm outdated --format json > "$RUNNER_TEMP/outdated.json" || status=$?
          if [ "$status" -ne 0 ] && [ ! -s "$RUNNER_TEMP/outdated.json" ]; then
            echo "::error::pnpm outdated failed with status $status"
            exit 1
          fi
          # The newest @types/node of the Node line CI runs, which pnpm outdated doesn't tell. pnpm
          # writes a failure as JSON on stdout: anything but a version fails the step.
          set -o pipefail
          TYPES_NODE_LINE_LATEST=$(pnpm view "@types/node@$(cat .node-version)" version --json |
            node --input-type=module -e 'const v = [JSON.parse(await new Response(process.stdin).text())].flat().at(-1); if (typeof v !== "string" || !/^\d+\.\d+\.\d+$/.test(v)) { console.error(`::error::no @types/node version: ${JSON.stringify(v)}`); process.exit(1); } console.log(v)')
          export TYPES_NODE_LINE_LATEST
          node scripts/dependencies/outdated.ts < "$RUNNER_TEMP/outdated.json"
